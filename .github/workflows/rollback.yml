name: Manual production rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing GHCR image tag (prefer a previously deployed commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate input and prepare SSH
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo 'Image tag may contain only letters, digits, dot, underscore, and hyphen' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deployment files
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/app' }}
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$target" \
            "mkdir -p '$APP_DIR/infra/caddy'"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml infra/scripts/deploy.sh infra/scripts/backup-postgres.sh \
            "$target:$APP_DIR/"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            infra/caddy/Caddyfile "$target:$APP_DIR/infra/caddy/Caddyfile"

      - name: Deploy selected tag and verify or auto-rollback
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/app' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$target" \
            "cd '$APP_DIR' && chmod +x deploy.sh backup-postgres.sh && ./deploy.sh '$IMAGE_TAG' '$image_prefix' '${GITHUB_ACTOR}'"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
