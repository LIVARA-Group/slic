name: Release

# Every push to `production` is verified, built into images and deployed.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false # never cancel a deployment that is already running

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: image (${{ matrix.app }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers / secrets on this GitHub Environment.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key, no TOFU

      - name: Copy deployment files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/app' }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "mkdir -p '$APP_DIR/infra/caddy'"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            docker-compose.prod.yml infra/scripts/deploy.sh infra/scripts/backup-postgres.sh \
            "$TARGET:$APP_DIR/"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            infra/caddy/Caddyfile "$TARGET:$APP_DIR/infra/caddy/Caddyfile"

      - name: Deploy (with health check and automatic rollback)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/app' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The registry token goes through stdin, never through the command line.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$TARGET" \
            "cd '$APP_DIR' && chmod +x deploy.sh backup-postgres.sh && ./deploy.sh '${GITHUB_SHA}' '${IMAGE_PREFIX}' '${GITHUB_ACTOR}'"

      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
