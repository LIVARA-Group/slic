name: GHCR cleanup

on:
  schedule:
    - cron: "45 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Retain recent ${{ matrix.image }} versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ api, web ]
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
