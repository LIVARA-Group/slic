name: Browser, accessibility, and bundle checks

on:
  pull_request:
    branches: [ production ]
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slic
          POSTGRES_PASSWORD: slic
          POSTGRES_DB: slic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slic -d slic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://slic:slic@localhost:5432/slic_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/shared build
      - run: pnpm --filter @repo/database build
      - name: Install Chromium and system dependencies
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: pnpm --filter @repo/web test:e2e
        env:
          CI: true
          DEBUG: pw:webserver

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Enforce 500 KiB compressed JavaScript budget
        run: |
          size=$(gzip -c apps/web/dist/assets/*.js | wc -c)
          echo "Compressed JavaScript: ${size} bytes"
          test "$size" -le 512000
