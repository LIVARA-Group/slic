name: Documentation validation

on:
  pull_request:
    branches: [ production ]
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [ production ]
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Validate local Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check local Markdown links and fragments
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments README.md SECURITY.md apps/web/README.md 'docs/**/*.md'
          lycheeVersion: v0.24.2
          fail: true
