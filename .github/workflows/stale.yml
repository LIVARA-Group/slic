name: Stale issues and pull requests

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security
          stale-issue-message: "This issue has had no activity recently. It will close in 14 days unless updated."
          stale-pr-message: "This pull request has had no activity recently. It will close in 14 days unless updated."
          close-issue-message: "Closing due to inactivity. Reopen or comment if this still needs attention."
          close-pr-message: "Closing due to inactivity. Reopen or comment if this is still needed."
