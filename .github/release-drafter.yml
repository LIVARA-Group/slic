name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
change-template: '- $TITLE (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: $COMPARE_URL
exclude-labels:
  - skip-changelog
categories:
  - title: 'Features'
    labels:
      - feature
      - enhancement
  - title: 'Fixes'
    labels:
      - bug
  - title: 'Security'
    labels:
      - security
  - title: 'Maintenance'
    labels:
      - dependencies
      - ci
      - docs
      - chore
  - title: 'Other changes'
    labels:
      - '*'
