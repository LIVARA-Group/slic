packages:
  - apps/*
  - packages/*

# Supply-chain security
blockExoticSubdeps: true
minimumReleaseAge: 2880 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
trustPolicy: no-downgrade

# Single place for versions shared by several packages: use "catalog:" in package.json.
catalog:
  typescript: ~7.0.2
  zod: ^4.6.7
  vite: ^8.0.0
  vitest: ^5.1.0
  "@vitest/coverage-v8": ^5.1.0
  "@types/node": ^26.6.6
  oxlint: ^1.94.0
  oxlint-tsgolint: ^7.0.2001
  turbo: ^2.11.12

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12

# Needed by `pnpm deploy` (used by the API Dockerfile) so workspace packages are copied, not linked.
injectWorkspacePackages: true
allowBuilds:
  esbuild: false
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
